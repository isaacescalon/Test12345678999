cide where to focus limited testing time.`,question:`Which framing best fits this audience?`,options:[`Write it like a dramatic news exposé to grab their attention`,`Frame the AI as a risk analyst producing a measured, decision-ready summary for people who will act on it`,`Assume the committee already suspects fraud and confirm it`,`Skip framing — audit committees don’t need context`],correct:1,explanation:`A high-stakes, decision-making audience needs measured, actionable analysis — not dramatization or a foregone conclusion.`},{skill:`Context`,scenario:`You’re asking the AI to evaluate a revenue-recognition question involving a multi-year contract with performance obligations.`,question:`What context matters most for a defensible answer?`,options:[`The general definition of "revenue"`,`The specific contract terms — deliverables, timing, and payment structure`,`The company’s stock price`,`A generic textbook example of revenue recognition`],correct:1,explanation:`Revenue recognition judgment calls hinge on the specific contract terms, not general definitions or unrelated examples.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to identify possible internal control weaknesses from a process description.`,question:`What constraint most protects the credibility of the output?`,options:[`Let it state any weakness it finds as a confirmed problem`,`Ask it to phrase findings as possibilities requiring follow-up testing, not confirmed conclusions`,`No constraint — auditors will fact-check everything anyway`,`Ask it to only report weaknesses that are financially catastrophic`],correct:1,explanation:`Control gaps identified from a description alone are hypotheses, not proven findings — the output should say so.`}]},economics:{beginner:[{skill:`Role & Audience`,scenario:`You want an explanation of supply and demand for a classmate who’s never taken an economics class.`,question:`Which role fits best?`,options:[`A campaigning politician`,`A patient tutor using everyday examples`,`A stockbroker pitching a trade`,`A courtroom witness`],correct:1,explanation:`A tutor role paired with everyday examples matches a true beginner’s needs.`},{skill:`Context`,scenario:`You want the AI to explain why the price of a specific good went up recently.`,question:`What context does it need?`,options:[`Nothing — it can guess a plausible reason`,`What actually changed — for example, a supply shortage or a demand increase`,`The color of the product packaging`,`An unrelated product’s price history`],correct:1,explanation:`Without the actual change that occurred, any explanation the AI gives is just a guess dressed up as an answer.`},{skill:`Format & Constraints`,scenario:`You need a study guide comparing four market structures for an exam.`,question:`Which format works best?`,options:[`One long paragraph mixing all four together`,`A comparison table with a column for each market structure`,`A single sentence per structure with no comparison`,`A story about a business owner`],correct:1,explanation:`A table makes the differences between structures scannable — exactly what exam review needs.`}],intermediate:[{skill:`Role & Audience`,scenario:`You’re preparing a one-page tariff-impact brief for a small-business owner client with no economics background.`,question:`How should you frame this for the AI?`,options:[`Use dense academic terminology throughout`,`Frame it as a practical explainer tied to what it means for their costs and pricing`,`Write it for fellow economics PhDs`,`Skip explaining the "why" behind the effects`],correct:1,explanation:`A business-owner audience needs the practical bottom line, not academic framing.`},{skill:`Context`,scenario:`You want the AI to analyze a demand shift after new data show local income rising 5% for a normal good.`,question:`What context is essential?`,options:[`The general definition of GDP`,`The specific data point — income rose 5% for a normal good — and what that implies`,`Nothing, the AI can pick a plausible generic answer`,`The history of an unrelated market`],correct:1,explanation:`Economic analysis depends on the specific facts given; the income change and good type are exactly what drives the correct direction of the shift.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to forecast how a regional economic indicator might trend next quarter.`,question:`What constraint should you add?`,options:[`Let it state the forecast as a guaranteed outcome`,`Ask it to base the forecast only on the data given, state assumptions, and flag uncertainty`,`No constraint is necessary for a forecast`,`Ask it to ignore the data and estimate freely`],correct:1,explanation:`Forecasts are inherently uncertain — asking for explicit assumptions and flagged uncertainty avoids false confidence.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re writing a policy-impact assessment for decision-makers who will use it to weigh real tradeoffs, not just learn the theory.`,question:`Which framing serves this audience best?`,options:[`Frame the AI as an advocate arguing for one predetermined conclusion`,`Frame it as a neutral analyst laying out tradeoffs and distributional effects for people who must decide`,`Skip the tradeoffs since decision-makers already know them`,`Write it exactly like an intro textbook chapter`],correct:1,explanation:`Decision-makers weighing real tradeoffs need neutral, decision-ready analysis — not advocacy or introductory-level framing.`},{skill:`Context`,scenario:`You’re asking the AI to assess how a trade shock could affect a specific regional industry.`,question:`What context is most important to include?`,options:[`A general history of trade theory`,`The specific industry’s exposure — its trade dependence, key inputs, and regional role`,`The definition of a tariff`,`An unrelated country’s trade data`],correct:1,explanation:`A meaningful regional impact assessment depends on that industry’s actual exposure, not general trade theory.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to critically review an economic forecast someone else produced.`,question:`What constraint keeps this review rigorous?`,options:[`Ask it to simply agree the forecast looks reasonable`,`Ask it to separately evaluate where the evidence is strong, where it’s weak, and what’s pure assumption`,`No constraint — a review doesn’t need structure`,`Ask it to produce its own competing forecast instead of reviewing the first one`],correct:1,explanation:`A rigorous review distinguishes evidence quality from assumption — agreement or a competing forecast both skip the actual review.`}]},finance:{beginner:[{skill:`Role & Audience`,scenario:`You want compound interest explained to a friend who’s never taken a finance class.`,question:`Which role fits best?`,options:[`A hedge fund manager pitching a fund`,`A patient personal-finance educator using everyday examples`,`A bond rating agency`,`An IRS auditor`],correct:1,explanation:`An educator role with everyday examples matches a true beginner’s needs.`},{skill:`Context`,scenario:`You want the AI to forecast next quarter’s cash flow.`,question:`What context is essential?`,options:[`The company’s logo colors`,`Historical cash flow data and any known upcoming changes`,`Nothing — forecasts don’t need data`,`A competitor’s stock price only`],correct:1,explanation:`A forecast is only as good as the historical pattern and known changes it’s built on.`},{skill:`Format & Constraints`,scenario:`You need a study guide comparing liquidity, profitability, and leverage ratios.`,question:`Which format works best?`,options:[`One long paragraph mixing all the ratios together`,`A table with formulas and what each ratio tells you`,`A single sentence with no formulas`,`A story about a company`],correct:1,explanation:`A table lets you compare formulas and meaning side by side — ideal for exam review.`}],intermediate:[{skill:`Role & Audience`,scenario:`Your valuation summary will be read by an investment committee deciding whether to fund a project.`,question:`How should you frame this for the AI?`,options:[`Write it like a textbook chapter`,`Frame it for decision-makers under time pressure who need the recommendation and key numbers up front`,`Use first-person storytelling`,`Skip the numbers entirely`],correct:1,explanation:`Committees scan for the recommendation and supporting numbers first — that’s what the framing should prioritize.`},{skill:`Context`,scenario:`You want the AI to assess credit risk for a borrower using limited financial data.`,question:`What context matters most?`,options:[`The borrower’s industry reputation alone, with no financials`,`The actual financial data provided, plus what’s missing from it`,`A different borrower’s financial statements`,`Nothing — assess risk from the company name`],correct:1,explanation:`Credit risk assessment needs the real financial data — and knowing what’s missing matters just as much as what’s there.`},{skill:`Format & Constraints`,scenario:`You need the AI to lay out a sensitivity analysis for a capital budgeting decision.`,question:`Which output instruction is most useful?`,options:[`A single number with no explanation`,`A table showing NPV under different discount-rate and growth-rate scenarios`,`A tweet-length summary only`,`An unlabeled list of numbers`],correct:1,explanation:`Sensitivity analysis is about seeing how the result changes — a table across scenarios is the format that shows that.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing an M&A financial review for executives who will use it to decide whether to proceed with a deal.`,question:`Which framing fits best?`,options:[`Frame the AI as a deal cheerleader building excitement for the acquisition`,`Frame it as an independent analyst surfacing both the case for and risks against the deal`,`Skip framing since executives already have an opinion`,`Focus only on synergies and omit the risks`],correct:1,explanation:`A decision this consequential needs an independent, balanced view — not advocacy for a predetermined outcome.`},{skill:`Context`,scenario:`You’re asking the AI to evaluate a valuation that depends heavily on which growth-rate assumption is used.`,question:`What context is most critical to include?`,options:[`The company’s office location`,`The specific assumptions driving the valuation and how sensitive the result is to them`,`A generic valuation formula with no company-specific inputs`,`An unrelated company’s valuation for comparison`],correct:1,explanation:`When a valuation is assumption-driven, understanding which inputs move the result the most is the whole point of the review.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to separate facts, assumptions, and open questions in an investment opportunity review.`,question:`What constraint makes this review trustworthy?`,options:[`Let it blend facts and assumptions together for a smoother narrative`,`Ask it to explicitly label each claim as fact, assumption, or open question`,`No constraint — investors can sort that out themselves`,`Ask it to only report the positive facts`],correct:1,explanation:`Investment decisions hinge on knowing what’s verified versus assumed — blending them or omitting the negative undermines the whole review.`}]},entrepreneurship:{beginner:[{skill:`Role & Audience`,scenario:`You want feedback on a rough business idea before pitching it to classmates.`,question:`Which role should you assign the AI?`,options:[`A hostile investor trying to embarrass you`,`A supportive startup mentor giving specific, constructive feedback`,`A patent attorney`,`A direct competitor`],correct:1,explanation:`For early feedback, a mentor role produces usable, constructive critique rather than discouragement.`},{skill:`Context`,scenario:`You want the AI to help write a value proposition for a campus food-delivery app.`,question:`What context matters most?`,options:[`Nothing about the customer`,`Who the target customer is and the specific problem they have`,`The founder’s personal hobbies`,`A random unrelated business`],correct:1,explanation:`A value proposition only makes sense relative to a specific customer and their problem.`},{skill:`Format & Constraints`,scenario:`You need a first draft of a business model canvas.`,question:`Which output request works best?`,options:[`A single unstructured paragraph`,`Content organized into the nine standard canvas blocks`,`A poem about the business`,`A yes/no answer`],correct:1,explanation:`The business model canvas has a standard nine-block structure — asking for that keeps the output usable.`}],intermediate:[{skill:`Role & Audience`,scenario:`You’re drafting a one-pager to send to a potential angel investor.`,question:`How should the prompt frame the audience?`,options:[`Write it like a diary entry`,`Frame it for someone scanning quickly for problem, market size, and traction`,`Use only technical engineering jargon`,`Make it as long as possible`],correct:1,explanation:`Investors skim for problem, market, and traction first — the framing should match how they actually read.`},{skill:`Context`,scenario:`You want the AI to design an MVP experiment to test your startup’s riskiest assumption.`,question:`What context is essential?`,options:[`The founder’s favorite color`,`What the riskiest assumption actually is and how you’d know if it’s wrong`,`A competitor’s unrelated product`,`Nothing — any experiment will do`],correct:1,explanation:`A useful MVP experiment tests a specific assumption — without naming it, the experiment has no target.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to size the market for a new venture idea.`,question:`What constraint should you add?`,options:[`Let it state any number it likes as fact`,`Ask it to show its assumptions and math for TAM/SAM/SOM so you can check the logic`,`No constraint necessary`,`Ask it to skip market sizing entirely`],correct:1,explanation:`Market-sizing numbers are only useful if you can see and verify the assumptions behind them.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing investor due-diligence questions from the perspective of someone deciding whether to write a check.`,question:`Which framing fits best?`,options:[`Frame the AI as the founder defending the pitch`,`Frame it as a skeptical-but-fair investor probing traction, market, and risk`,`Skip the skepticism to keep things positive`,`Assume the investor already trusts every claim`],correct:1,explanation:`Due diligence requires genuine scrutiny — an investor persona that probes rather than defends surfaces the real risks.`},{skill:`Context`,scenario:`You’re asking the AI to evaluate whether a startup should pivot its business model.`,question:`What context is most critical?`,options:[`The founder’s personal preference for the new idea`,`The specific signals suggesting the current model isn’t working, and what evidence exists for the alternative`,`A generic list of famous pivots`,`Nothing — pivots are always a good idea`],correct:1,explanation:`A pivot decision should be grounded in the actual signals and evidence, not preference or general pivot stories.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to assess technology, market, execution, and adoption risks for a new innovation.`,question:`What constraint keeps this assessment useful?`,options:[`Treat every risk as equally likely and severe`,`Ask it to rank risks by likelihood and impact based on the information given`,`No constraint — list every risk imaginable`,`Only report risks with obvious, easy fixes`],correct:1,explanation:`Ranking by likelihood and impact turns a long risk list into something a team can actually prioritize.`}]},gscm:{beginner:[{skill:`Role & Audience`,scenario:`You want a beginner-friendly explanation of the procurement cycle.`,question:`Which role fits best?`,options:[`An adversarial vendor`,`A supply chain instructor explaining the cycle step by step`,`A customs enforcement officer`,`A courtroom witness`],correct:1,explanation:`An instructor role matches the goal: a clear, step-by-step explanation for someone new to the topic.`},{skill:`Context`,scenario:`You want the AI to evaluate whether current inventory levels risk a stockout.`,question:`What context is essential?`,options:[`No data at all`,`Current inventory levels, lead times, and recent demand trends`,`The company’s mission statement`,`Competitor logos`],correct:1,explanation:`A stockout-risk assessment depends entirely on inventory, lead time, and demand data.`},{skill:`Format & Constraints`,scenario:`You need a beginner guide to transportation and distribution decisions.`,question:`Which format is most useful for studying?`,options:[`One long unbroken paragraph`,`A guide organized by transport mode with tradeoffs listed for each`,`A single sentence`,`A poem about shipping`],correct:1,explanation:`Organizing by mode with tradeoffs makes the comparison easy to study and recall.`}],intermediate:[{skill:`Role & Audience`,scenario:`Your supplier scorecard will be reviewed by a procurement director deciding which vendors to keep.`,question:`How should the output be framed for this audience?`,options:[`Bury the recommendation in a long narrative`,`Lead with clear metrics and a direct recommendation per supplier`,`Only use emojis`,`Leave out cost data`],correct:1,explanation:`A decision-maker needs metrics and a clear recommendation up front, not a narrative to dig through.`},{skill:`Context`,scenario:`You want the AI to analyze historical demand and its forecasting implications.`,question:`What context matters most?`,options:[`A generic forecasting formula with no company data`,`The actual historical demand data, including any seasonality or trend`,`The company’s logo colors`,`An unrelated product’s demand history`],correct:1,explanation:`Forecasting implications only make sense relative to that product’s actual demand pattern.`},{skill:`Format & Constraints`,scenario:`You’re preparing a sales-and-operations planning (S&OP) brief from supplied information.`,question:`What output structure works best?`,options:[`A single unstructured paragraph`,`Sections for demand, supply, constraints, and decisions needed`,`A one-word answer`,`A list with no headings`],correct:1,explanation:`S&OP briefs are decision documents — separating demand, supply, constraints, and decisions is what makes them actionable.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing a supply-chain risk assessment for executives who must decide where to invest in resilience.`,question:`Which framing fits best?`,options:[`Frame the AI as an alarmist predicting worst-case outcomes as certain`,`Frame it as a risk analyst prioritizing mitigation investment by likelihood and impact`,`Skip prioritization — list every possible risk equally`,`Assume executives already know which risks matter most`],correct:1,explanation:`Investment decisions need prioritized, credible risk analysis — not alarmism or an unprioritized list.`},{skill:`Context`,scenario:`You’re asking the AI to assess how a major disruption could affect a specific supply chain.`,question:`What context is most critical?`,options:[`A generic list of historical disruptions elsewhere`,`The specific dependencies in this supply chain — key suppliers, lead times, and alternatives`,`The company’s stock price`,`An unrelated company’s disruption response`],correct:1,explanation:`A meaningful disruption assessment depends on this chain’s actual dependencies, not disruptions elsewhere.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to evaluate alternative distribution-network designs against business constraints.`,question:`What constraint keeps the evaluation rigorous?`,options:[`Let it recommend a design without stating tradeoffs`,`Ask it to evaluate each option against cost, service, and capacity, and state the tradeoffs explicitly`,`No constraint — one option is usually obviously best`,`Ask it to ignore capacity limits to simplify the analysis`],correct:1,explanation:`Network design decisions involve real tradeoffs — a rigorous evaluation states them rather than hiding them behind a single recommendation.`}]},"information-systems":{beginner:[{skill:`Role & Audience`,scenario:`You want database concepts explained to someone who has never designed one.`,question:`Which role fits best?`,options:[`A cybersecurity attacker`,`A patient systems-analysis instructor`,`A courtroom expert witness`,`An anonymous forum poster`],correct:1,explanation:`A patient instructor role matches the goal of a clear, foundational explanation for a beginner.`},{skill:`Context`,scenario:`You want the AI to write requirements for a management dashboard.`,question:`What context matters most?`,options:[`Nothing about what managers need to see`,`The specific business questions the dashboard must answer and who will use it`,`The company’s stock ticker`,`Screenshots of an unrelated app`],correct:1,explanation:`Good requirements start from the business questions the dashboard needs to answer and who is using it.`},{skill:`Format & Constraints`,scenario:`You need a data governance checklist for a shared spreadsheet.`,question:`Which output request is most useful?`,options:[`One unstructured sentence`,`A checklist covering ownership, quality checks, access, and retention`,`A single emoji`,`A full legal contract`],correct:1,explanation:`A structured checklist across the key governance areas is directly actionable.`}],intermediate:[{skill:`Role & Audience`,scenario:`Your IT project status update goes to executives with no technical background.`,question:`How should the output be framed?`,options:[`Full stack traces and code snippets`,`Plain-language status, risks, and next steps tied to business impact`,`Only acronyms`,`Skip the risks entirely`],correct:1,explanation:`Executives need business impact in plain language, not implementation detail.`},{skill:`Context`,scenario:`You want the AI to review a proposed database structure for design issues.`,question:`What context is essential?`,options:[`The actual tables, fields, and relationships being proposed`,`A generic definition of a database`,`The company’s marketing materials`,`An unrelated database from a different industry`],correct:0,explanation:`Reviewing a specific design requires the actual structure — tables, fields, and relationships — not a generic definition.`},{skill:`Format & Constraints`,scenario:`You’re identifying a business process suitable for automation.`,question:`What constraint keeps the recommendation credible?`,options:[`Let it assume automation always saves money with no analysis`,`Ask it to weigh expected benefits against real implementation risks`,`No constraint — automation is always the right call`,`Ask it to ignore risk entirely`],correct:1,explanation:`A credible automation recommendation weighs benefits against real risks, not just assumed upside.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing a cyber risk assessment for leadership deciding where to allocate security budget.`,question:`Which framing fits best?`,options:[`Frame the AI as certain about which specific attack will happen`,`Frame it as a risk analyst ranking threats by likelihood and impact without false certainty`,`Skip likelihood — treat every threat as equally urgent`,`Assume leadership already has full technical context`],correct:1,explanation:`Budget decisions need honest, ranked risk analysis — cyber threats are probabilistic, not predictable with certainty.`},{skill:`Context`,scenario:`You’re asking the AI to build a business case for adopting a new AI tool.`,question:`What context is most critical?`,options:[`A generic list of AI benefits with no company specifics`,`The specific use case, expected ROI drivers, and this organization’s constraints`,`An unrelated company’s AI success story`,`The vendor’s marketing copy alone`],correct:1,explanation:`A credible business case is grounded in this organization’s actual use case and constraints, not generic benefits or vendor marketing.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to evaluate a company’s data strategy for governance and execution risk.`,question:`What constraint makes this evaluation trustworthy?`,options:[`Let it praise the strategy without probing gaps`,`Ask it to separately assess data value, governance, and execution risk, flagging evidence gaps`,`No constraint — data strategies are hard to evaluate anyway`,`Ask it to only focus on the technology, not governance`],correct:1,explanation:`A trustworthy strategy evaluation separates distinct dimensions and is honest about where evidence is thin.`}]}},de={"international-business":{beginner:[{skill:`Role & Audience`,scenario:`You want cultural-communication tips for working with a business partner in another country.`,question:`Which role fits best?`,options:[`A stereotyping comedian`,`A cross-cultural business coach giving practical, respectful guidance`,`An immigration officer`,`A competitor`],correct:1,explanation:`A coach role focused on practical, respectful guidance avoids stereotyping while staying useful.`},{skill:`Context`,scenario:`You want the AI to screen potential markets for expansion.`,question:`What context is essential?`,options:[`No criteria at all`,`The specific screening criteria you care about, like market size, growth, and competition`,`The founder’s travel history`,`Unrelated country trivia`],correct:1,explanation:`Market screening only works if the AI knows which criteria to screen on.`},{skill:`Format & Constraints`,scenario:`You need a comparison of market-entry modes: exporting, licensing, joint venture, and so on.`,question:`Which output format works best?`,options:[`One unstructured paragraph`,`A table comparing modes on cost, risk, and control`,`A single word`,`A poem`],correct:1,explanation:`Comparing multiple options across multiple factors is exactly what a table is for.`}],intermediate:[{skill:`Role & Audience`,scenario:`Your global expansion brief goes to senior management deciding on a significant international investment.`,question:`How should the output be framed?`,options:[`Write it casually like a text message`,`Lead with risk and opportunity for decision-makers, with supporting detail after`,`Use only slang`,`Omit the risks`],correct:1,explanation:`Decision-makers need risk and opportunity up front, with detail to back it up.`},{skill:`Context`,scenario:`You want the AI to analyze pricing considerations for a product entering another country.`,question:`What context matters most?`,options:[`The competitor’s logo design`,`Local currency, costs, and competitive pricing in that market`,`An unrelated country’s pricing`,`Nothing — pricing translates directly`],correct:1,explanation:`Cross-border pricing depends on the destination market’s actual currency, cost, and competitive conditions.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to evaluate how a trade-policy change could affect a company’s operations.`,question:`What constraint keeps this evaluation grounded?`,options:[`Let it assume the policy’s full economic effects are already known`,`Ask it to base the evaluation on this company’s specific exposure — supply chain, costs, markets`,`No constraint needed`,`Ask it to ignore the policy details`],correct:1,explanation:`A useful evaluation is grounded in this company’s specific exposure, not general policy effects.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing a geopolitical risk review for executives who must decide whether to proceed with a cross-border deal.`,question:`Which framing fits best?`,options:[`Frame the AI as certain about how geopolitical events will unfold`,`Frame it as an analyst laying out risk scenarios and their business implications`,`Skip scenarios — just pick the most likely outcome as fact`,`Assume executives don’t need the reasoning, just a yes/no`],correct:1,explanation:`Geopolitical risk is inherently uncertain — scenario-based analysis serves decision-makers better than false certainty.`},{skill:`Context`,scenario:`You’re asking the AI to assess currency exposure for a cross-border deal.`,question:`What context is most critical?`,options:[`A general definition of exchange rates`,`The specific currencies involved, deal timeline, and size of exposure`,`An unrelated company’s currency policy`,`Nothing — currency risk is the same for every deal`],correct:1,explanation:`Currency risk assessment depends on the specific currencies, timeline, and exposure size involved in this deal.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to assess currency risk for that same deal.`,question:`What constraint keeps the assessment realistic?`,options:[`Let it predict the exact future exchange rate as fact`,`Ask it to describe exposure and scenarios rather than predicting a precise rate`,`No constraint needed`,`Ignore currency risk entirely`],correct:1,explanation:`No one can predict exact future exchange rates — describing exposure and scenarios is the honest framing.`}]},management:{beginner:[{skill:`Role & Audience`,scenario:`You want help understanding major leadership styles for an intro management class.`,question:`Which role fits best?`,options:[`A drill sergeant barking orders`,`A patient instructor comparing styles with workplace examples`,`A competitor executive`,`A talk-show host`],correct:1,explanation:`An instructor role with real examples matches a beginner’s need to understand and compare concepts.`},{skill:`Context`,scenario:`You want the AI to explain how organizational culture influences employee behavior.`,question:`What context helps most?`,options:[`Nothing — the concept is universal`,`A specific example workplace or situation to ground the explanation`,`The company’s stock price`,`An unrelated topic`],correct:1,explanation:`A grounding example makes an abstract concept like "culture" concrete and easier to learn from.`},{skill:`Format & Constraints`,scenario:`You need a simple checklist for making better business decisions.`,question:`Which format is most useful?`,options:[`A single unstructured paragraph`,`A numbered checklist of steps and criteria to consider`,`A one-word answer`,`A story with no clear steps`],correct:1,explanation:`A numbered checklist is directly usable the next time you face a decision.`}],intermediate:[{skill:`Role & Audience`,scenario:`You want help drafting how to deliver difficult performance feedback to an employee.`,question:`Which role fits best?`,options:[`An aggressive drill sergeant`,`An experienced, fair-minded HR coach`,`The employee’s competitor`,`A comedian`],correct:1,explanation:`A fair-minded coach role produces guidance that’s firm but constructive.`},{skill:`Context`,scenario:`You want the AI to analyze a team’s declining performance.`,question:`What context matters most?`,options:[`No data, just guess`,`The specific performance metrics and any recent changes, like a new manager or workload shift`,`The company’s logo`,`An unrelated team’s data`],correct:1,explanation:`Diagnosing a decline requires the actual metrics and what changed recently.`},{skill:`Format & Constraints`,scenario:`Your change-management brief goes to frontline supervisors who will deliver the message to their teams.`,question:`How should the output be framed?`,options:[`Abstract corporate strategy language only`,`Practical, concrete guidance they can act on and repeat to their teams`,`Only for the CEO’s eyes`,`Skip what changes for employees`],correct:1,explanation:`Supervisors need practical talking points they can pass along, not abstract strategy language.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re asking the AI to help design a structured approach to resolving a high-stakes leadership conflict.`,question:`Which framing keeps the AI’s input fair?`,options:[`Tell it which person is right beforehand`,`Ask it to lay out each party’s interests neutrally before suggesting options`,`Skip neutrality — pick a side to move faster`,`Assume it knows more about the conflict than it’s been told`],correct:1,explanation:`A neutral framing of each side’s interests keeps the AI from prematurely taking sides in a conflict it only knows secondhand.`},{skill:`Context`,scenario:`You’re asking the AI to evaluate workforce strategy scenarios for a changing business environment.`,question:`What context is most critical?`,options:[`A generic workforce-planning template`,`The specific business changes driving the need — growth, automation, market shift, etc.`,`An unrelated company’s workforce plan`,`Nothing — the scenarios write themselves`],correct:1,explanation:`Useful scenarios are grounded in the specific forces actually driving change at this organization.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to evaluate a complex management decision involving competing objectives.`,question:`What constraint produces a more defensible answer?`,options:[`Ask it to pick the "obviously correct" option with no tradeoff discussion`,`Ask it to lay out the tradeoffs between objectives explicitly before recommending`,`No constraint — complex decisions rarely have real tradeoffs`,`Ask it to ignore objectives that complicate the analysis`],correct:1,explanation:`Decisions with genuinely competing objectives need the tradeoffs surfaced, not hidden behind a confident pick.`}]},marketing:{beginner:[{skill:`Role & Audience`,scenario:`You want a first draft product description for an online store.`,question:`Which role fits best?`,options:[`A legal compliance officer`,`An experienced e-commerce copywriter`,`A customer service complaint line`,`A competitor’s ad team`],correct:1,explanation:`A copywriter role is tuned to write persuasive, benefit-focused text.`},{skill:`Context`,scenario:`You want the AI to write a product description for running shoes.`,question:`What context helps most?`,options:[`Nothing about the product or buyer`,`Who’s buying them and the product’s key benefits`,`An unrelated product’s description`,`The store’s return policy only`],correct:1,explanation:`A description is only persuasive if it’s tied to who’s buying and what they actually care about.`},{skill:`Format & Constraints`,scenario:`You need a content calendar mapped to a product launch.`,question:`Which output format works best?`,options:[`An unstructured list with no dates`,`A calendar or table with dates, channels, and content themes`,`A single caption`,`A legal disclaimer`],correct:1,explanation:`A calendar-style table is what makes a content plan schedulable and assignable.`}],intermediate:[{skill:`Role & Audience`,scenario:`Your customer persona will guide a product team building features for busy working parents.`,question:`How should the persona be framed?`,options:[`A generic "everyone" persona`,`A specific persona built around busy working parents’ goals and pain points`,`A persona of the CEO`,`No persona, just guess`],correct:1,explanation:`A useful persona is specific to the real target audience.`},{skill:`Context`,scenario:`You want the AI to analyze a recent campaign’s performance.`,question:`What context is essential?`,options:[`No metrics at all`,`The specific metrics — clicks, conversions, spend — from the campaign`,`The company’s founding year only`,`A different company’s campaign`],correct:1,explanation:`Campaign analysis requires the actual performance metrics from that campaign.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to draw conclusions from attribution data about which channel drove sales.`,question:`What constraint keeps the conclusion honest?`,options:[`Let it claim certainty that one channel caused all sales`,`Ask it to note where the data supports correlation but not full causation`,`No constraint needed`,`Ignore the data and guess`],correct:1,explanation:`Attribution data is often correlational, not fully causal — the AI should say so rather than overclaiming.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing a pricing strategy assessment for leadership deciding whether to raise prices.`,question:`Which framing fits best?`,options:[`Frame the AI as sales, focused only on closing more deals`,`Frame it as a neutral analyst weighing customer value, competition, and financial impact together`,`Skip competitive context — focus only on internal costs`,`Assume the answer is always "raise prices"`],correct:1,explanation:`A pricing decision this consequential needs a balanced view across customer, competitive, and financial evidence.`},{skill:`Context`,scenario:`You’re asking the AI to segment a customer base using provided data.`,question:`What context is most critical?`,options:[`A generic list of common customer segments`,`The actual data available and its quality/completeness`,`An unrelated company’s segmentation`,`Nothing — segments are universal`],correct:1,explanation:`Real segmentation should be grounded in the specific data you have, including its limitations.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to evaluate attribution evidence for a multi-channel campaign.`,question:`What constraint produces a more trustworthy evaluation?`,options:[`Let it state definitively which channel caused the most sales`,`Ask it to flag where causal claims are too strong given the available evidence`,`No constraint — attribution data speaks for itself`,`Ask it to ignore channels with weaker data`],correct:1,explanation:`Attribution evidence is often ambiguous — flagging overreach keeps the evaluation honest instead of overconfident.`}]},hospitality:{beginner:[{skill:`Role & Audience`,scenario:`You want a guide to handling an upset hotel guest at the front desk.`,question:`Which role fits best?`,options:[`An indifferent bystander`,`An experienced guest-service trainer modeling calm, practical responses`,`The guest’s lawyer`,`A competitor hotel’s manager`],correct:1,explanation:`A guest-service trainer role produces calm, practical scripts appropriate for real front-desk situations.`},{skill:`Context`,scenario:`You want the AI to explain the basic departments and workflows of a hotel.`,question:`What context helps most?`,options:[`Nothing — hotels are all identical`,`Whether this is for a student new to hospitality or an experienced manager`,`The hotel’s stock price`,`An unrelated industry’s departments`],correct:1,explanation:`Naming the learner’s experience level tells the AI how much to simplify.`},{skill:`Format & Constraints`,scenario:`You need practice scenarios for handling common guest complaints.`,question:`Which format is most useful?`,options:[`A single unstructured paragraph`,`Several labeled scenarios, each with a sample response`,`A one-word answer`,`A legal contract`],correct:1,explanation:`Labeled, separate scenarios with sample responses are what you can actually practice with.`}],intermediate:[{skill:`Role & Audience`,scenario:`Your occupancy analysis goes to a general manager planning next quarter’s staffing.`,question:`How should the output be framed?`,options:[`Write it as a bedtime story`,`Lead with occupancy trends and a clear staffing implication`,`Only use industry jargon with no explanation`,`Skip the trend, just give raw numbers`],correct:1,explanation:`A GM planning staffing needs the trend translated into a clear implication, not raw numbers or jargon alone.`},{skill:`Context`,scenario:`You want the AI to analyze recent guest satisfaction survey results.`,question:`What context is essential?`,options:[`No survey data, just guess`,`The actual survey themes and scores, and what recently changed at the property`,`The hotel’s logo colors`,`A different property’s data`],correct:1,explanation:`Analyzing satisfaction trends requires the real survey results and what recently changed at that property.`},{skill:`Format & Constraints`,scenario:`You need an event operations plan for a campus event.`,question:`Which output format is most useful?`,options:[`A single unstructured paragraph`,`A timeline with staffing, guest flow, and contingencies clearly separated`,`A poem`,`A one-word answer`],correct:1,explanation:`Event operations have distinct moving parts that are far easier to execute when laid out separately.`}],advanced:[{skill:`Role & Audience`,scenario:`You’re preparing a hospitality crisis-response plan for executives who must act quickly during a real disruption.`,question:`Which framing fits best?`,options:[`Frame the AI as calm and speculative, filling gaps with guesses presented as fact`,`Frame it as a crisis-response analyst who clearly separates known facts from unknowns`,`Skip urgency — treat it like a routine report`,`Assume executives don’t need the reasoning, just an order`],correct:1,explanation:`Crisis response requires clarity about what’s actually known versus unknown — guessing dressed as fact is dangerous here.`},{skill:`Context`,scenario:`You’re asking the AI to assess risks that could disrupt guest experience.`,question:`What context is most critical?`,options:[`A generic list of hospitality risks from other properties`,`The specific operational details and dependencies of this property`,`An unrelated hotel’s risk register`,`Nothing — all hotels face the same risks equally`],correct:1,explanation:`A useful risk assessment is grounded in this property’s actual operations, not generic industry risks.`},{skill:`Format & Constraints`,scenario:`You’re asking the AI to evaluate whether a restaurant concept should expand to a new location.`,question:`What constraint produces a more defensible recommendation?`,options:[`Let it recommend expansion based on enthusiasm alone`,`Ask it to weigh market, operational, and financial evidence together and flag data gaps`,`No constraint — expansion decisions are usually obvious`,`Ask it to ignore financial considerations`],correct:1,explanation:`An expansion decision this consequential needs evidence across multiple dimensions, with gaps clearly flagged.`}]},"writing-coach":{beginner:[{skill:`Role & Audience`,scenario:`You want help writing a thesis statement for a short class essay.`,question:`Which role fits best?`,options:[`A harsh literary critic`,`A patient writing tutor giving constructive suggestions`,`A publisher rejecting the essay`,`A competitor classmate`],correct:1,explanation:`A tutor role gives constructive, encouraging help appropriate for a student still learning.`},{skill:`Context`,scenario:`You want feedback on a paragraph you wrote for class.`,question:`What context helps the AI give useful feedback?`,options:[`Nothing — just paste the paragraph`,`The assignment prompt and what the paragraph is supposed to accomplish`,`Your grade in a different class`,`An unrelated paragraph`],correct:1,explanation:`Feedback is only useful if the AI knows what the paragraph is trying to achieve.`},{skill:`Format & Constraints`,scenario:`You need a self-editing checklist for a short paper before turning it in.`,question:`Which format works best?`,options:[`A single unstructured paragraph`,`A short checklist of specific things to check, in order`,`A one-word answer`,`A list of unrelated writing tips`],correct:1,explanation:`A short, ordered checklist is something you can actually run through before submitting.`}],intermediate:[{skill:`Role & Audience`,scenario:`You’re drafting a cover letter for a specific job posting.`,question:`How should you frame the role and audience?`,options:[`Ask the AI to write generically about your skills`,`Ask it to tailor the letter to this specific job posting and hiring manager’s likely priorities`,`Ask it to copy a template with no customization`,`Skip the audience — cover letters are all the same`],correct:1,explanation:`A tailored letter aimed at the actual posting is far more persuasive than a generic one.`},{skill:`Context`,scenario:`You want the AI to help paraphrase a source for a research paper.`,question:`What context is essential?`,options:[`Nothing — paraphrasing is mechanical`,`The original passage and how i
